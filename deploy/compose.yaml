name: campus-judge
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-db-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [business]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U campus_migrator -d campus']
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build: {context: .., dockerfile: deploy/Dockerfile.domain}
    command: [sh, -c, 'node src/migrate.mjs && node grants.mjs']
    environment:
      DATABASE_URL: postgres://campus_migrator:${POSTGRES_PASSWORD}@db:5432/campus
    networks: [business]
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
  api:
    build: {context: .., dockerfile: deploy/Dockerfile.api}
    environment:
      DATABASE_URL: postgres://campus_app:${APP_DB_PASSWORD}@db:5432/campus
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      JUDGE_IMAGE: campus-judge-py3.12-numpy2.2.6-clang19-libstdcxx14-cxx23-node22-gojudge1.13.2
      PORT: 3001
      HOST: 0.0.0.0
      COOKIE_SECURE: 'true'
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    networks: [edge, business]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile.domain}
    command: [node, worker.mjs]
    environment:
      WORKER_DATABASE_URL: postgres://campus_worker:${WORKER_DB_PASSWORD}@db:5432/campus
      GO_JUDGE_URL: http://judge:5050
      GO_JUDGE_TOKEN: ${JUDGE_AUTH_TOKEN:?set JUDGE_AUTH_TOKEN}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_NODE_ID: ${WORKER_NODE_ID:-judge-node-01}
      JUDGE_ENVIRONMENT_VERSION: campus-judge-py3.12-numpy2.2.6-clang19-libstdcxx14-cxx23-node22-gojudge1.13.2
    networks: [business, execution]
    depends_on:
      migrate: {condition: service_completed_successfully}
      judge: {condition: service_started}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  judge:
    build: {context: .., dockerfile: deploy/Dockerfile.judge}
    # go-judge's trusted controller needs cgroup/namespace privileges. Student
    # processes run as uid>=10000 in separate network/mount/pid namespaces.
    # No host port, Docker socket, host network, app volume or database access.
    privileged: true
    environment:
      ES_AUTH_TOKEN: ${JUDGE_AUTH_TOKEN:?set JUDGE_AUTH_TOKEN}
    shm_size: 256m
    networks: [execution]
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 256
  web:
    build: {context: .., dockerfile: deploy/Dockerfile.web}
    networks: [edge]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  gateway:
    image: caddy:2.10.2-alpine
    environment:
      CAMPUS_HOST: ${CAMPUS_HOST:?set CAMPUS_HOST}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [api, web]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
networks:
  edge: {}
  business: {internal: true}
  execution: {internal: true}
volumes:
  database: {}
  caddy_data: {}
  caddy_config: {}
